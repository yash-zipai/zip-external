name: Deploy FastAPI to EC2

on:
  push:
    branches:
      - main


jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3

      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |

          cd /home/ec2-user/zip-external

          echo "Pull latest code"

          # .env is no longer tracked: keep the server's copy across the reset
          # (the reset to the commit that untracked it would delete it).
          if [ -f .env ]; then cp .env /tmp/zip-external.env.keep; fi

          git fetch origin
          git reset --hard origin/main

          if [ ! -f .env ] && [ -f /tmp/zip-external.env.keep ]; then cp /tmp/zip-external.env.keep .env; fi

          echo "Install dependencies"

          pip install -r requirements.txt


          echo "Restart FastAPI"

          sudo systemctl restart fastapi


          echo "Deployment completed"
